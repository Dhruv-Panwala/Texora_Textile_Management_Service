spring.application.name=TextileManagement
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${APP_SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${APP_SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=${APP_SESSION_TIMEOUT:30m}
server.servlet.session.cookie.name=${APP_SESSION_COOKIE_NAME:JSESSIONID}
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.table-name=SPRING_SESSION
spring.session.jdbc.cleanup-cron=0 * * * * *
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:textile_management;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:8}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:5000}
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT_MS:1000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1740000}
spring.datasource.hikari.keepalive-time=${DB_POOL_KEEPALIVE_MS:120000}

app.auth.signup-enabled=${APP_SIGNUP_ENABLED:true}
app.audit.retention-days=${APP_AUDIT_RETENTION_DAYS:180}
app.mail.outbox.poll-ms=${APP_MAIL_OUTBOX_POLL_MS:5000}
app.public-url=${APP_PUBLIC_URL:http://localhost:5173}
app.mail.from=${MAIL_FROM:}
app.trusted-proxy=${APP_TRUSTED_PROXY:none}
app.auth.rate-limit.max-failures=${APP_AUTH_RATE_LIMIT_MAX_FAILURES:10}
app.auth.rate-limit.window-seconds=${APP_AUTH_RATE_LIMIT_WINDOW_SECONDS:900}
app.request.max-json-bytes=${APP_MAX_JSON_BYTES:262144}
app.sales.max-taka-entries=${APP_MAX_TAKA_ENTRIES:200}
app.pdf.max-pages=${APP_MAX_PDF_PAGES:20}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

app.storage.mode=${APP_STORAGE_MODE:database}
app.storage.bucket=${APP_STORAGE_BUCKET:}
app.storage.region=${APP_STORAGE_REGION:us-east-1}
app.storage.endpoint=${APP_STORAGE_ENDPOINT:}
app.storage.access-key=${APP_STORAGE_ACCESS_KEY:}
app.storage.secret-key=${APP_STORAGE_SECRET_KEY:}

spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.flyway.enabled=true

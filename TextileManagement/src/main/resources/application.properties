spring.application.name=TextileManagement
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${APP_SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=12h
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:textile_management;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

app.auth.family-username=${APP_FAMILY_USERNAME:family}
app.auth.family-password=${APP_FAMILY_PASSWORD:family123}
app.auth.family-email=${APP_FAMILY_EMAIL:}
app.auth.signup-enabled=${APP_SIGNUP_ENABLED:true}
app.audit.retention-days=${APP_AUDIT_RETENTION_DAYS:180}
app.public-url=${APP_PUBLIC_URL:http://localhost:5173}
app.mail.from=${MAIL_FROM:}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

app.storage.mode=${APP_STORAGE_MODE:database}
app.storage.bucket=${APP_STORAGE_BUCKET:}
app.storage.region=${APP_STORAGE_REGION:us-east-1}
app.storage.endpoint=${APP_STORAGE_ENDPOINT:}
app.storage.access-key=${APP_STORAGE_ACCESS_KEY:}
app.storage.secret-key=${APP_STORAGE_SECRET_KEY:}

spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.flyway.enabled=true

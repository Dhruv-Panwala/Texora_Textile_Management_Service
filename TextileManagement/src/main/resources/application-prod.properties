spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:8}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:5000}
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT_MS:1000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1740000}
spring.datasource.hikari.keepalive-time=${DB_POOL_KEEPALIVE_MS:120000}

app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN}
app.auth.signup-enabled=${APP_SIGNUP_ENABLED:false}
app.mail.outbox.poll-ms=${APP_MAIL_OUTBOX_POLL_MS:5000}
app.seed.enabled=false
app.public-url=${APP_PUBLIC_URL}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.h2.console.enabled=false
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.name=__Host-TEXTILESESSION
app.trusted-proxy=${APP_TRUSTED_PROXY}
app.auth.rate-limit.max-failures=${APP_AUTH_RATE_LIMIT_MAX_FAILURES:10}
app.auth.rate-limit.window-seconds=${APP_AUTH_RATE_LIMIT_WINDOW_SECONDS:900}
app.request.max-json-bytes=${APP_MAX_JSON_BYTES:262144}
app.sales.max-taka-entries=${APP_MAX_TAKA_ENTRIES:200}
app.pdf.max-pages=${APP_MAX_PDF_PAGES:20}
app.storage.mode=${APP_STORAGE_MODE:s3}
